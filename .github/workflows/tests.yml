name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows / Python ${{ matrix.python }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          python -m pip install --upgrade pip 2>&1 | tee install.log
          python -m pip install -r requirements.txt pytest pytest-qt 2>&1 | tee -a install.log

      - name: Show the environment
        shell: bash
        run: |
          python -VV
          python -c "import PySide6, pytest, pytestqt; print('PySide6', PySide6.__version__); print('pytest', pytest.__version__)"

      # PowerShell is the runner's own shell, so this avoids the MSYS layer that
      # sat between pytest and the runner on the first attempt.
      #
      # The "pytest returned" line matters: if it is missing from the log, the
      # interpreter died instead of exiting, which points at native teardown
      # rather than at a test.
      - name: Run the test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q --tb=short 2>&1 | Tee-Object -FilePath pytest.log
          $code = $LASTEXITCODE
          Write-Output "pytest returned $code"
          "### pytest exit code`n`n``````n$code`n``````" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          if ($code -ne 0) { exit $code }

      # The log of a failed job is only readable by someone logged in, so the
      # failing tests are copied into the run summary where anyone can see them.
      # This also has to explain a failure that happened before pytest ran,
      # which is why the install log is included as a fallback.
      - name: Summarise failures
        if: failure()
        shell: bash
        run: |
          {
            echo "### Environment"
            echo ""
            echo '```'
            python -VV 2>&1 || true
            python -c "import PySide6; print('PySide6', PySide6.__version__)" 2>&1 || true
            echo '```'
            echo ""
            if [ -f pytest.log ]; then
              echo "### Failed tests"
              echo ""
              echo '```'
              grep -E "^(FAILED|ERROR)" pytest.log | head -40 || true
              echo '```'
              echo ""
              echo "### Tracebacks"
              echo ""
              echo '```'
              sed -n '/=== FAILURES ===/,$p' pytest.log | head -160 || true
              echo '```'
            fi
            if [ -f install.log ]; then
              echo ""
              echo "### Tail of the install log"
              echo ""
              echo '```'
              tail -40 install.log || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
