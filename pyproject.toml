[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartsort"
version = "1.0.0"
description = "Local-first Windows download organizer with browser integration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SmartSort Project" }]
keywords = ["downloads", "organizer", "windows", "pyside6"]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "PySide6>=6.6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pyinstaller>=6.3",
]

[project.scripts]
smartsort = "smartsort.app.main:main"
smartsort-host = "smartsort.app.browser.native_host:main"

[project.gui-scripts]
smartsort-gui = "smartsort.app.main:main"

[tool.setuptools.packages.find]
include = ["smartsort*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "windows: test requires the Windows platform",
    "slow: long running test",
]
filterwarnings = [
    "error::DeprecationWarning:smartsort.*",
]
